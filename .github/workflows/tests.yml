# Unit tests on macOS (the verified platform) and Linux for every push and pull request.
# Web tests need a browser download and stay out of CI; run them with `pytest -m web`.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[all,dev]"
      - run: python -m pytest -q -m "not web"

  package:      # the wheel must carry the agent skill (an editable install would not notice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - run: python -m zipfile -l dist/*.whl | grep -q "ainotate/skill/SKILL.md"
      - run: python -m pip install dist/*.whl && cd /tmp && ainotate install-skill --zip /tmp/out
